<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: an architect's site model, calm and exact.
   IDEA: the street as it stands, rebuilt from LiDAR, one house picked out in yellow.
   PICTURE: the featured house and its two neighbours in 3D on real terrain, orbitable.
   COLOUR and TYPE: the houses' own brick, siding and shingle; black ink, #ffe600 accent; Hanken Grotesk.
   LAYOUT: scene edge to edge; one card bottom-left with facts and view controls. */
:root{color-scheme:light dark;--card:light-dark(#ffffffee,#232322ee);--ink:light-dark(#151515,#f1f1ee);--mute:light-dark(#5c5f61,#a9aaa5);--line:light-dark(#d8d8d4,#3a3a38);--bg:light-dark(#e9ecee,#1a1a19);--acc:#ffe600}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.card{position:fixed;left:16px;bottom:16px;width:min(380px,calc(100vw - 32px));background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:18px 20px 16px;box-shadow:0 10px 30px #0002}
.card h1{font-size:clamp(26px,4vw,34px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--mute);margin:4px 0 10px;font-size:15px}
.tag{display:inline-block;background:var(--acc);color:#151515;font-size:13px;font-weight:700;border-radius:4px;padding:1px 7px;margin-bottom:8px}
.tag.n{background:var(--line);color:var(--ink)}
dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 10px}
dl div{border-top:1px solid var(--line);padding-top:6px}
dt{font-size:13px;color:var(--mute)}
dd{margin:0;font-size:17px;font-weight:700;white-space:nowrap}
.look{font-size:14px;margin:0 0 12px;color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 15px "Hanken Grotesk",system-ui,sans-serif;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.note{font-size:13px;color:var(--mute);margin:12px 0 0}
.hint{position:fixed;top:14px;right:16px;font-size:13px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
@media(max-width:600px){.card{left:8px;right:8px;bottom:8px;width:auto;padding:14px}dd{font-size:15px}.note,.hint,.look{display:none}button{padding:0 10px;font-size:14px}}
</style>
</head>
<body>
<div id="scene" aria-label="3D model of the featured house and its neighbors"></div>
<div class="hint">Drag to orbit · scroll or pinch to zoom · tap a house</div>
<section class="card" aria-live="polite">
  <span class="tag" id="tag">Featured address</span>
  <h1 id="addr">__TITLE__</h1>
  <p class="sub" id="sub"></p>
  <dl id="stats"></dl>
  <p class="look" id="look"></p>
  <div class="btns">
    <button id="v-street">Street view</button>
    <button id="v-aerial">Aerial</button>
    <button id="v-spin" aria-pressed="false">Spin</button>
    <button id="v-dusk" aria-pressed="false">Dusk</button>
  </div>
  <p class="note" id="note"></p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{
const S=/*__DATA__*/null,GRID="__GRID__";
document.getElementById('sub').textContent=S.sub;
document.getElementById('note').textContent=`Measured from USGS 3DEP LiDAR (${S.lidar_years}): ground, house positions, footprints, wall heights, roof shapes and pitches, and tree positions and heights. Location: ${S.precision==='address-point'?'National Address Database point':S.precision==='street'?'approximate (street-level geocode), so the featured house may be a neighbor':'given coordinates'}. Streets: ${S.street_source==='osm'?'OpenStreetMap; paving':'paved areas'} from LiDAR intensity. Facades (windows, doors, garages, colours) are generated, not observed.`;
/* ---------- renderer ---------- */
const host=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,1,3000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.05;controls.minDistance=25;controls.maxDistance=700;
camera.position.set(120,110,190);controls.target.set(0,10,10);
const hemi=new THREE.HemisphereLight(0xe4eef6,0x5d7040,0.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1dc,1.15);
sun.position.set(-120,200,160);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-220,right:220,top:220,bottom:-220,near:10,far:700});sun.shadow.bias=-0.0006;scene.add(sun);

/* ---------- procedural textures (UVs are in feet; repeat = 1/tile) ---------- */
function ctex(w,h,draw,tile){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;if(tile){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/tile,1/tile)}return t}
const rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})();
function brickDraw(g,W,H){g.fillStyle='#bfb4a6';g.fillRect(0,0,W,H);const rows=24,rh=H/rows,bw=W/8;
  for(let r=0;r<rows;r++)for(let i=-1;i<9;i++){const x=i*bw+(r%2)*bw/2;const l=30+rnd()*12,hu=8+rnd()*10;g.fillStyle=`hsl(${hu},${42+rnd()*14}%,${l}%)`;g.fillRect(x+2,r*rh+2,bw-4,rh-4)}}
function sidingDraw(col){return(g,W,H)=>{g.fillStyle=col;g.fillRect(0,0,W,H);const n=8,bh=H/n;for(let i=0;i<n;i++){const y=i*bh;const gr=g.createLinearGradient(0,y,0,y+bh);gr.addColorStop(0,'rgba(255,255,255,.10)');gr.addColorStop(.85,'rgba(0,0,0,.03)');gr.addColorStop(1,'rgba(0,0,0,.22)');g.fillStyle=gr;g.fillRect(0,y,W,bh)}}}
function shingleDraw(g,W,H){g.fillStyle='#3a3c40';g.fillRect(0,0,W,H);const rows=16,rh=H/rows;for(let r=0;r<rows;r++){for(let i=-1;i<9;i++){const x=i*32+(r%2)*16+rnd()*6;const v=50+rnd()*22;g.fillStyle=`rgb(${v},${v+1},${v+5})`;g.fillRect(x+1,r*rh,30,rh-2)}g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,r*rh+rh-2,W,2)}}
function shakeDraw(g,W,H){g.fillStyle='#c4b18c';g.fillRect(0,0,W,H);for(let r=0;r<10;r++)for(let i=0;i<18;i++){const v=rnd()*24-12;g.fillStyle=`rgba(${v>0?255:0},${v>0?255:0},${v>0?255:0},${Math.abs(v)/120})`;g.fillRect(i*W/18+(r%2)*6,r*H/10,W/18-2,H/10-3)}}
const mk=(draw,tile,c=512,o={})=>new THREE.MeshStandardMaterial(Object.assign({map:ctex(c,c,draw,tile),roughness:.92},o));
const MAT={
  brick:mk(brickDraw,5.33),
  sid3625:mk(sidingDraw('#a6a8a3'),4.67,256),sid3627:mk(sidingDraw('#cbc5b6'),4.67,256),sid3623:mk(sidingDraw('#c4c5bf'),4.67,256),
  shingle:mk(shingleDraw,6.5,256),shake:mk(shakeDraw,4,256),
  trim:new THREE.MeshStandardMaterial({color:0xf4f3ee,roughness:.7}),
  grass:new THREE.MeshStandardMaterial({color:0x3d6524,roughness:1}),grassAcross:new THREE.MeshStandardMaterial({color:0x5c8538,roughness:1}),
  asphalt:new THREE.MeshStandardMaterial({color:0x3c3f42,roughness:.95,side:THREE.DoubleSide}),conc:new THREE.MeshStandardMaterial({color:0xcbc8c0,roughness:.9,side:THREE.DoubleSide}),
  drive:new THREE.MeshStandardMaterial({color:0x2c2f32,roughness:.95}),mulch:new THREE.MeshStandardMaterial({color:0x5a3a28,roughness:1}),
  black:new THREE.MeshStandardMaterial({color:0x1b1c1e,roughness:.6}),stone:new THREE.MeshStandardMaterial({color:0xa9a49a,roughness:1,flatShading:true}),
  shrub:new THREE.MeshStandardMaterial({color:0x2f5a2c,roughness:1,flatShading:true}),trunk:new THREE.MeshStandardMaterial({color:0x5b4636,roughness:1}),
  acc:new THREE.MeshStandardMaterial({color:0xffe600,emissive:0x5a5200,roughness:.6}),deck:new THREE.MeshStandardMaterial({color:0x8f7a64,roughness:.9})
};
const solid=c=>new THREE.MeshStandardMaterial({color:c,roughness:.75});

/* windows: colour map with grilles + emissive map for dusk */
function drawWin(g,W,H,arched,lit){
  g.clearRect(0,0,W,H);const path=(i)=>{g.beginPath();if(arched){g.moveTo(i,H-i);g.lineTo(i,W/2);g.arc(W/2,W/2,W/2-i,Math.PI,0);g.lineTo(W-i,H-i)}else g.rect(i,i,W-2*i,H-2*i);g.closePath()};
  path(0);g.fillStyle=lit?'#000':'#f6f5f0';g.fill();
  path(9);const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,lit?'#ffd58a':'#4d5d6b');gr.addColorStop(.5,lit?'#ffc26a':'#24313c');gr.addColorStop(1,lit?'#ffcf80':'#3a4855');g.fillStyle=gr;g.fill();
  if(lit)return;g.save();path(9);g.clip();g.strokeStyle='#f3f2ec';g.lineWidth=4;
  const top=arched?W/2:9;for(const fx of[1/3,2/3]){g.beginPath();g.moveTo(W*fx,top);g.lineTo(W*fx,H);g.stroke()}
  const mid=arched?(W/2+H)/2:H*.52;g.lineWidth=8;g.beginPath();g.moveTo(0,mid);g.lineTo(W,mid);g.stroke();g.lineWidth=4;
  for(const y of[(top+mid)/2,(mid+H)/2]){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  if(arched){g.beginPath();g.moveTo(0,W/2);g.lineTo(W,W/2);g.stroke();for(const a of[.25,.5,.75]){g.beginPath();g.moveTo(W/2,W/2);g.lineTo(W/2-Math.cos(a*Math.PI)*W/2,W/2-Math.sin(a*Math.PI)*W/2);g.stroke()}}
  g.restore();g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.moveTo(14,H*.2);g.lineTo(W*.45,14);g.lineTo(W*.6,14);g.lineTo(14,H*.32);g.fill();
}
const winMat={};
for(const a of[false,true]){winMat[a]=new THREE.MeshStandardMaterial({map:ctex(128,a?224:200,(g,W,H)=>drawWin(g,W,H,a,false)),emissiveMap:ctex(128,a?224:200,(g,W,H)=>drawWin(g,W,H,a,true)),emissive:0xffffff,emissiveIntensity:0,transparent:true,alphaTest:.5,roughness:.3,metalness:.1})}
function garageMat(col){return new THREE.MeshStandardMaterial({roughness:.6,map:ctex(256,208,(g,W,H)=>{g.fillStyle=col;g.fillRect(0,0,W,H);for(let r=0;r<4;r++){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,r*H/4,W,3);for(let c=0;c<4;c++){const x=c*W/4+10,y=r*H/4+12,w=W/4-20,h=H/4-22;g.fillStyle='rgba(255,255,255,.10)';g.fillRect(x,y,w,3);g.fillRect(x,y,3,h);g.fillStyle='rgba(0,0,0,.22)';g.fillRect(x,y+h-3,w,3);g.fillRect(x+w-3,y,3,h)}}})})}
function doorMat(col){return new THREE.MeshStandardMaterial({roughness:.5,map:ctex(128,256,(g,W,H)=>{g.fillStyle=col;g.fillRect(0,0,W,H);[[14,14,40,60],[74,14,40,60],[14,88,40,70],[74,88,40,70],[14,172,40,70],[74,172,40,70]].forEach(([x,y,w,h])=>{g.fillStyle='rgba(255,255,255,.09)';g.fillRect(x,y,w,4);g.fillRect(x,y,4,h);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x,y+h-4,w,4);g.fillRect(x+w-4,y,4,h)});g.fillStyle='#c8a64a';g.beginPath();g.arc(100,132,5,0,7);g.fill()})})}

/* ---------- geometry helpers ---------- */
function mesh(geo,mat,x,y,z,p,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;p.add(m);return m}
function boxUV(w,h,d){const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv,dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];for(let f=0;f<6;f++)for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*dims[f][0],uv.getY(k)*dims[f][1])}return g}
function box(w,h,d,mat,x,y,z,p,s){return mesh(boxUV(w,h,d),mat,x,y,z,p,s)}
// wall with brick (or other) front and siding elsewhere: material order px,nx,py,ny,pz,nz
function wall(p,w,h,d,x,y,z,front,side,frontSides){return mesh(boxUV(w,h,d),[frontSides?front:side,frontSides?front:side,side,side,front,side],x,y,z,p)}
// gable: wall triangle + shingle slabs + white rake boards. axis 'x' => ridge runs along local x.
function gable(p,axis,span,len,h,base,cx,cz,wallMat,ends=[1,-1]){
  const sh=new THREE.Shape();sh.moveTo(-span/2,0);sh.lineTo(span/2,0);sh.lineTo(0,h);sh.closePath();
  const g=new THREE.ExtrudeGeometry(sh,{depth:len,bevelEnabled:false});g.translate(0,0,-len/2);if(axis==='x')g.rotateY(Math.PI/2);
  mesh(g,wallMat,cx,base,cz,p);
  const a=Math.atan(h/(span/2)),run=span/2+1.2,L=run/Math.cos(a),off=(L/2)*Math.cos(a),y=base+h-(L/2)*Math.sin(a)+.4;
  for(const s of[1,-1]){
    if(axis==='x'){const m=box(len+2,.6,L,MAT.shingle,cx,y,cz+s*off,p);m.rotation.x=s*a;
      for(const e of ends){const r=box(.5,.9,L,MAT.trim,cx+e*(len/2+.75),y-.35,cz+s*off,p,false);r.rotation.x=s*a}}
    else{const m=box(L,.6,len+2,MAT.shingle,cx+s*off,y,cz,p);m.rotation.z=-s*a;
      for(const e of ends){const r=box(L,.9,.5,MAT.trim,cx+s*off,y-.35,cz+e*(len/2+.75),p,false);r.rotation.z=-s*a}}
  }
}
const glows=[];
function win(p,x,y,z,o={}){
  const w=o.w||3,h=o.h||(o.arched?5.6:4.8),gp=new THREE.Group();gp.position.set(x,y,z);gp.rotation.y=o.ry||0;p.add(gp);
  const pl=mesh(new THREE.PlaneGeometry(w,h),winMat[!!o.arched],0,0,.12,gp,false);glows.push(pl);
  box(w+.5,.35,.5,MAT.trim,0,-h/2-.15,.2,gp,false);
  if(!o.arched)box(w+.6,.45,.3,MAT.trim,0,h/2+.2,.12,gp,false);
  if(o.shutter)for(const s of[-1,1])box(w*.48,h+.2,.22,o.shutter,s*(w/2+w*.24+.2),0,.12,gp,false);
  return gp;
}
function oculus(p,x,y,z,r){mesh(new THREE.CircleGeometry(r,32),MAT.trim,x,y,z,p,false);const v=mesh(new THREE.CircleGeometry(r*.72,32),solid(0x30363c),x,y,z+.03,p,false);glows.push(v)}
function garageDoor(p,x,z,w,col){box(w+.9,7.6,.25,MAT.trim,x,3.8,z+.05,p,false);mesh(new THREE.PlaneGeometry(w,7),garageMat(col),x,3.5,z+.2,p,false)}
function frontDoor(p,x,z,col,o={}){
  box(5.2,8.8+(o.transom?1.4:0),.3,MAT.trim,x,4.4+1.2+(o.transom?.7:0),z+.08,p,false);
  mesh(new THREE.PlaneGeometry(3.2,7),doorMat(col),x,1.2+3.5,z+.26,p,false);
  if(o.transom){const t=mesh(new THREE.PlaneGeometry(3.2,1),winMat[false],x,9.3,z+.26,p,false);glows.push(t)}
  if(o.pediment){const sh=new THREE.Shape();sh.moveTo(-3,0);sh.lineTo(3,0);sh.lineTo(0,1.3);sh.closePath();mesh(new THREE.ExtrudeGeometry(sh,{depth:.5,bevelEnabled:false}),MAT.trim,x,10.4+(o.transom?1.4:0)-1.2,z,p,false)}
}
function shrub(p,x,z,r=1.8,cone=false){settle(cone?mesh(new THREE.ConeGeometry(r,r*3.6,7),MAT.shrub,x,r*1.8,z,p):mesh(new THREE.IcosahedronGeometry(r,0),MAT.shrub,x,r*.75,z,p),p)}
function bed(p,x,z,w,d){settle(box(w,.25,d,MAT.mulch,x,.12,z,p,false),p)}
function tree(p,x,z,s,col,bare=.5){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);p.add(g);settle(g,p);
  mesh(new THREE.CylinderGeometry(.7,1.1,16,7),MAT.trunk,0,8,0,g);
  const m=new THREE.MeshStandardMaterial({color:col,roughness:1,flatShading:true,transparent:bare<1,opacity:bare<1?.92:1});
  mesh(new THREE.IcosahedronGeometry(10,1),m,0,22,0,g);mesh(new THREE.IcosahedronGeometry(7,1),m,4,28,-2,g);mesh(new THREE.IcosahedronGeometry(6.5,1),m,-4,26,3,g);
}
function arbor(p,x,z,h=20){settle(mesh(new THREE.ConeGeometry(3,h,8),MAT.shrub,x,h/2+1,z,p),p);settle(mesh(new THREE.CylinderGeometry(.4,.5,2,6),MAT.trunk,x,1,z,p),p)}
function lamp(p0,x0,z0){const p=new THREE.Group(),x=0,z=0;p.position.set(x0,0,z0);p0.add(p);settle(p,p0);mesh(new THREE.CylinderGeometry(.18,.25,7,8),MAT.black,x,3.5,z,p);box(1,1.4,1,solid(0xffe9b8),x,7.6,z,p,false);mesh(new THREE.ConeGeometry(.9,.8,4),MAT.black,x,8.7,z,p).rotation.y=Math.PI/4;}
function mailbox(p0,x0,z0){const p=new THREE.Group();p.position.set(x0,0,z0);p0.add(p);settle(p,p0);box(.45,4,.45,MAT.trim,0,2,0,p);box(1.2,1.2,2,MAT.black,0,4.4,0,p)}

/* ---------- terrain: bare-earth DEM, feet relative to PAD, rows north->south ---------- */
const DN=S.n,DC=S.cell,DEM=Float32Array.from(GRID.split(','),v=>v/10);
function hAt(x,z){let fx=x/DC+DN/2-.5,fz=z/DC+DN/2-.5;fx=Math.max(0,Math.min(DN-1.001,fx));fz=Math.max(0,Math.min(DN-1.001,fz));const i=Math.floor(fz),j=Math.floor(fx),u=fx-j,v=fz-i,g=(r,c)=>DEM[r*DN+c];
  return g(i,j)*(1-u)*(1-v)+g(i,j+1)*u*(1-v)+g(i+1,j)*(1-u)*v+g(i+1,j+1)*u*v}
function settle(o,p){const v=o.position.clone();if(p!==scene)p.localToWorld(v);o.position.y+=hAt(v.x,v.z)-(p===scene?0:p.position.y);return o}
function terrain(size,seg,drop,mat){const g=new THREE.PlaneGeometry(size,size,seg,seg);g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,hAt(p.getX(i),p.getZ(i))-drop);g.computeVertexNormals();const m=new THREE.Mesh(g,mat);m.receiveShadow=true;scene.add(m);return m}
const EXT=DN*DC;
/* ground texture: grass, with paved areas (roads, drives, parking) measured from LiDAR return intensity */
const GROUND=(()=>{const N=1024,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');g.fillStyle='#4f7a30';g.fillRect(0,0,N,N);
  let sd=11;const rr=()=>(sd=(sd*16807)%2147483647)/2147483647;for(let k=0;k<9000;k++){g.fillStyle=`rgba(${rr()<.5?'255,255,200':'20,40,10'},${.04+rr()*.05})`;g.fillRect(rr()*N,rr()*N,2+rr()*6,2+rr()*6)}
  const P=S.pavement;if(P){const n=P.n,px=N/n;g.fillStyle='#55585b';P.rle.forEach((runs,i)=>{for(let k=0;k<runs.length;k+=2)g.fillRect(runs[k]*px,i*px,runs[k+1]*px+.5,px+.5)});
    g.globalAlpha=.25;g.filter='blur(2px)';g.drawImage(c,0,0);g.filter='none';g.globalAlpha=1}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t})();
terrain(EXT,DN-1,0,new THREE.MeshStandardMaterial({map:GROUND,roughness:1}));terrain(EXT*4,120,.6,MAT.grass);

/* ---------- streets: OpenStreetMap centrelines (or a straight stand-in in front of the house) ---------- */
const HALF={motorway:24,trunk:22,primary:20,secondary:17,tertiary:15,unclassified:13,residential:14,living_street:12,service:7};
const FEAT=S.houses.find(h=>h.role==='featured');
let ROADS=S.roads.slice();
/* no map data: draw no street rather than invent one */
const RP=[];
